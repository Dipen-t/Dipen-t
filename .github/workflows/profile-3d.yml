name: Refresh 3D contribution skyline

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "scripts/style_contributions.py"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate contribution artwork
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Style focused contribution skyline
        run: python3 scripts/style_contributions.py
      - name: Commit updated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ assets/contributions-dark-depth.svg assets/contributions-light-depth.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution skyline"
            git push
          fi
