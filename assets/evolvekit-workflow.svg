<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-labelledby="title desc"><title id="title">EvolveKit change lifecycle</title><desc id="desc">Proposals use registered capabilities, previews isolate changes, exact revisions are approved, publication is atomic, and version history enables rollback.</desc><rect width="1200" height="278" rx="14" fill="#101828"/><text x="38" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#c5b5ff">EvolveKit · Changes with a review trail</text><rect x="38" y="97" width="196" height="122" rx="12" fill="#19243b" stroke="#33415d"/><text x="58" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f4ff">Propose</text><text x="58" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b8c7df">Registered capabilities</text><path d="M241 158h20m-7-6 7 6-7 6" fill="none" stroke="#b4a2ff" stroke-width="2"/><rect x="270" y="97" width="196" height="122" rx="12" fill="#19243b" stroke="#33415d"/><text x="290" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f4ff">Preview</text><text x="290" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b8c7df">Isolated changes</text><path d="M473 158h20m-7-6 7 6-7 6" fill="none" stroke="#b4a2ff" stroke-width="2"/><rect x="502" y="97" width="196" height="122" rx="12" fill="#19243b" stroke="#33415d"/><text x="522" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f4ff">Approve</text><text x="522" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b8c7df">Exact revision</text><path d="M705 158h20m-7-6 7 6-7 6" fill="none" stroke="#b4a2ff" stroke-width="2"/><rect x="734" y="97" width="196" height="122" rx="12" fill="#19243b" stroke="#33415d"/><text x="754" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f4ff">Publish</text><text x="754" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b8c7df">Atomic activation</text><path d="M937 158h20m-7-6 7 6-7 6" fill="none" stroke="#b4a2ff" stroke-width="2"/><rect x="966" y="97" width="196" height="122" rx="12" fill="#19243b" stroke="#33415d"/><text x="986" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f4ff">Roll back</text><text x="986" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#b8c7df">Version history</text><text x="38" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#94a8c7">Server validation and audit history accompany the lifecycle.</text></svg>